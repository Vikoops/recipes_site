{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Рецепты{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'recipes/css/styles.css' %}" />
 <link rel="icon" href="{% static 'recipes/images/favicon.ico' %}" sizes="any"> 
</head>
<body>

  <header class="site-header">
    <div class="inner">
      <a href="{% url 'home' %}" class="logo">Рецепты</a>
      <nav class="main-nav">
  <a href="{% url 'home' %}">Главная</a>
  <a href="{% url 'tag_list' %}">Теги</a>
  <a href="{% url 'stats' %}">Статистика</a>
  <a href="{% url 'about' %}">О сайте</a>
  <a href="{% url 'suggest_recipe' %}">Предложить рецепт</a>
</nav>

    </div>
  </header>

  <main class="main-content">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="site-footer">
    <div class="inner">
      <p>© {{ year|default:2025 }} Рецепты. Все права вторично запечены 🙂</p>
    </div>
  </footer>
</body>
</html>
