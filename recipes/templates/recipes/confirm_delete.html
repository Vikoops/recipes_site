{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
  <h1 class="page-title">{{ title }}</h1>
  <p>Вы уверены, что хотите удалить рецепт «{{ object.title }}»?</p>
  <form method="post">
    {% csrf_token %}
    <a class="btn ghost" href="{{ object.get_absolute_url }}">Отмена</a>
    <button class="btn" type="submit">Удалить</button>
  </form>
{% endblock %}
