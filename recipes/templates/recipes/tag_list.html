{% extends 'base.html' %}
{% block title %}Теги — Рецепты{% endblock %}
{% block content %}
  <h1 class="page-title">Теги</h1>
  <ul class="tags tags-cloud">
    {% for t in tags %}
      <li>
        <a class="tag" href="{{ t.get_absolute_url }}">
          {{ t.name }} <span class="tag-badge">{{ t.recipe_count }}</span>
        </a>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
